name = "mentor-api"
main = "src/index.ts"
compatibility_date = "2024-04-01"
compatibility_flags = ["nodejs_compat"]

# Daily 06:00 AM Cron Trigger (UTC 00:30 = 06:00 AM IST)
[triggers]
crons = ["30 0 * * *"]

[vars]
ENVIRONMENT = "production"
DEFAULT_TIMEZONE = "Asia/Kolkata"
TURSO_DATABASE_URL = "libsql://learning-sh15aa.aws-ap-south-1.turso.io"
# Sensitive credentials (TURSO_AUTH_TOKEN, GROQ_API_KEY, TELEGRAM_BOT_TOKEN, AUTH_SECRET)
# must be configured via Cloudflare encrypted secrets:
# `wrangler secret put TURSO_AUTH_TOKEN`
# `wrangler secret put GROQ_API_KEY`
# For local development, wrangler dev automatically reads from .dev.vars
